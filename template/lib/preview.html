</div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<script type="module">
// The preview page: one file, no build step, no network but this project's own server.
// Pieces, in order: basics, the edit and its films, the clock, drawing, input, panels, start-up.

// ------------------------------------------------------------ basics
const FPS = 30;
const DESK = 1536;
const $ = id => document.getElementById(id);
const clamp = (value, low, high) => Math.min(high, Math.max(low, value));
const pad = n => String(n).padStart(2, '0');
const sleep = ms => new Promise(done => setTimeout(done, ms));
// Two painted frames, or 250 ms: a tab that is not showing never paints, so it must not wait for one.
const frames = () => Promise.race([new Promise(done => requestAnimationFrame(() => requestAnimationFrame(done))), sleep(250)]);
const idle =  () => new Promise(done => (window.requestIdleCallback ? requestIdleCallback(done, { timeout: 300 }) : setTimeout(done, 40)));
const within = (promise, ms, message) => {
  let timer;
  const late = new Promise((_, fail) => { timer = setTimeout(() => fail(new Error(message)), ms); });
  return Promise.race([promise, late]).finally(() => clearTimeout(timer));
};
const clean = value => String(value?.stack || value?.message || value);
const stamp = t => {
  const cs = Math.round(Math.max(0, t) * 100);
  return `${Math.floor(cs / 6000)}:${pad(Math.floor(cs / 100) % 60)}.${pad(cs % 100)}`;
};
const size = n => (n >= 1e6 ? `${(n / 1e6).toFixed(1)} MB` : `${Math.round(n / 1e3)} KB`);
const ago = ms => {
  const s = Math.max(0, (Date.now() - ms) / 1000);
  return s < 60 ? 'just now' : s < 3600 ? `${Math.floor(s / 60)} min ago` : s < 86400 ? `${Math.floor(s / 3600)} h ago` : `${Math.floor(s / 86400)} d ago`;
};
const icon = (name, extra = '') => `<svg class="i ${extra}"><use href="#i-${name}"/></svg>`;
const setIcon = (node, name) => node.firstElementChild.setAttribute('href', `#i-${name}`);
const prefs = {
  get(key, fallback) { try { const value = localStorage.getItem(`preview.${key}`); return value === null ? fallback : JSON.parse(value); } catch { return fallback; } },
  set(key, value) { try { localStorage.setItem(`preview.${key}`, JSON.stringify(value)); } catch { /* storage can be blocked */ } },
};

const video = $('recording');
const stage = $('stage');
const only = new URLSearchParams(location.search).get('scene') || '';

// What the person sees and controls. The engine (c-engine.js) is the only writer.
const S = {
  time: 0, total: 0, playing: false, ended: false, loop: false, want: null,
  rate: [.5, .75, 1, 1.25, 1.5, 2].includes(prefs.get('rate', 1)) ? prefs.get('rate', 1) : 1,
  muted: prefs.get('muted', false) === true,
};

// ------------------------------------------------------------ toasts and menus
function toast(text, kind = '', ms = 3600) {
  const box = $('toasts');
  const last = box.lastElementChild;
  if (last && last.dataset.text === text) { clearTimeout(last._timer); last._timer = setTimeout(() => last.remove(), ms); return; }
  const node = document.createElement('div');
  node.className = `toast ${kind}`;
  node.dataset.text = text;
  node.innerHTML = icon(kind === 'error' ? 'alert' : kind === 'ok' ? 'check' : 'bolt');
  const span = document.createElement('span');
  span.textContent = text;
  node.append(span);
  box.append(node);
  while (box.children.length > 3) box.firstElementChild.remove();
  node._timer = setTimeout(() => node.remove(), ms);
}

const menus = [];
function menu(button, panel, onOpen) {
  const entry = { button, panel, onOpen };
  menus.push(entry);
  if (!panel.hasAttribute('tabindex')) panel.tabIndex = -1;
  button.addEventListener('click', event => {
    if (!panel.hidden) return closeMenu(entry);
    closeMenus();
    panel.hidden = false;
    button.setAttribute('aria-expanded', 'true');
    onOpen?.();
    // Opened from the keyboard: put focus inside so the arrows work.
    if (event.detail === 0) (panel.querySelector('[aria-checked=true], .mi, button, input') || panel).focus?.();
  });
  return entry;
}
function closeMenu(entry, refocus = false) {
  entry.panel.hidden = true;
  entry.button.setAttribute('aria-expanded', 'false');
  if (refocus) entry.button.focus();
}
function closeMenus(except) { for (const entry of menus) if (entry !== except && !entry.panel.hidden) closeMenu(entry); }
document.addEventListener('pointerdown', event => {
  for (const entry of menus) if (!entry.panel.hidden && !entry.panel.contains(event.target) && !entry.button.contains(event.target)) closeMenu(entry);
}, true);
// A click on a button must not leave focus on it, or Space would press it again.
document.addEventListener('mousedown', event => { if (event.target.closest('button, a')) event.preventDefault(); });

// ------------------------------------------------------------ the edit
// film/edit.mjs and the files it imports are read in a frame of their own: a new frame has a new
// module cache, so a saved edit is read again without reloading this page (or stopping the sound).
function loadEdit() {
  return new Promise(resolve => {
    const frame = document.createElement('iframe');
    const key = Math.random().toString(36).slice(2);
    const at = name => new URL(`film/${name}`, location.href.split('#')[0]).href;
    const finish = result => { clearTimeout(timer); removeEventListener('message', onMessage); frame.remove(); resolve(result); };
    const onMessage = event => { if (event.source === frame.contentWindow && event.data?.key === key) finish(event.data); };
    const timer = setTimeout(() => finish({ ok: false, message: 'Reading film/edit.mjs took more than 10 seconds.' }), 10000);
    addEventListener('message', onMessage);
    frame.hidden = true;
    frame.srcdoc = `<script type="module">
const send = data => parent.postMessage({ key: ${JSON.stringify(key)}, ...data }, '*');
const plain = value => JSON.parse(JSON.stringify(value ?? null));
try {
  const edit = await import(${JSON.stringify(at('edit.mjs'))});
  const words = await import(${JSON.stringify(at('words.mjs'))}).catch(() => ({}));
  send({ ok: true, data: plain({ NAME: edit.NAME, RECORDING: edit.RECORDING, SOURCE_FPS: edit.SOURCE_FPS, LEAD: edit.LEAD, PARTS: edit.PARTS, CLOSE: edit.CLOSE, MUTE: edit.MUTE, WORDS: words.WORDS }) });
} catch (error) { send({ ok: false, message: String(error && error.message || error) }); }
<` + `/script>`;
    document.body.append(frame);
  });
}


// ------------------------------------------------------------ the model: segments, words, films
// M is rebuilt every time the edit is read. Everything else asks M, so an edit that changes
// takes effect without the page restarting.
let M = { name: '', recording: '', lead: 0, close: null, mute: [], words: [], whole: [], segments: [], sound: false, sceneStart: null, key: '', take: 0, error: '', loading: true };

// A short fingerprint of the transcript, so a new take is noticed when the edit is read again.
const hash = text => { let h = 5381; for (let i = 0; i < text.length; i++) h = ((h * 33) ^ text.charCodeAt(i)) >>> 0; return h; };

function buildModel(data) {
  const parts = Array.isArray(data.PARTS) ? data.PARTS : [];
  const lead = Number(data.LEAD) || 0;
  const whole = [];
  let at = 0;
  parts.forEach((part, index) => {
    const own = index === 0 ? lead : 0;
    const length = own + part.to - part.from;
    whole.push({ ...part, lead: own, start: at, length });
    at += length;
  });
  let segments = whole;
  let sceneStart = null;
  if (only) {
    const index = parts.findIndex(part => part.film === only);
    sceneStart = index >= 0 ? whole[index].start : null;
    // A scene the edit does not play has no sound, and is as long as it says.
    segments = [index >= 0 ? { ...whole[index], start: 0 } : { film: only, lead: 0, start: 0, length: 0, silent: true }];
  }
  return {
    name: data.NAME || 'Preview', recording: data.RECORDING || '', lead, close: data.CLOSE || null,
    mute: Array.isArray(data.MUTE) ? data.MUTE : [], words: Array.isArray(data.WORDS) ? data.WORDS : [],
    whole, segments, sceneStart, error: '', loading: false,
    take: hash(JSON.stringify(data.WORDS ?? [])),
    sound: Boolean(data.RECORDING) && segments.some(segment => !segment.silent),
    key: JSON.stringify([data.NAME, data.RECORDING, data.LEAD, data.PARTS, data.CLOSE, data.MUTE]),
  };
}

const totalOf = segments => segments.reduce((sum, segment) => sum + segment.length, 0);
const segmentAt = t => M.segments.find(segment => t < segment.start + segment.length) || M.segments.at(-1);

// Where the recording is at a time in the cut, or null where it has none: a silent lead, a card
// that holds after the voice, or a scene the edit does not play.
function recAt(t) {
  const segment = segmentAt(t);
  if (!segment || segment.silent || !M.sound) return null;
  const into = t - segment.start - segment.lead;
  if (into < 0) return null;
  const at = segment.from + into;
  return video.duration && at >= video.duration - 1 / FPS ? null : at;
}

// The words around the one being said, found by bisecting the transcript.
function wordAt(at) {
  const words = M.words;
  let low = 0, high = words.length;
  while (low < high) { const mid = (low + high) >> 1; if (words[mid][1] <= at) low = mid + 1; else high = mid; }
  return low - 1;
}

// ------------------------------------------------------------ films
// Each film is its own page in a frame, posed by the same seek(t) the renderer calls. Every film is
// made up front and kept painted behind the one in view (each as its own layer, see .film in the
// CSS), so a cut only changes which one is on top: the first paint of a film at its cut is what
// used to freeze the picture there.
const films = new Map();
const filmTokens = new Map();

function loadFilm(name, replace = false) {
  const old = films.get(name);
  if (old && !replace) return old;
  const token = (filmTokens.get(name) || 0) + 1;
  filmTokens.set(name, token);
  const node = document.createElement('div');
  // A film that replaces another is painted behind it first, so the swap only changes which is on top.
  node.className = old ? 'film under' : 'film';
  node.setAttribute('aria-hidden', 'true');
  const frame = document.createElement('iframe');
  frame.tabIndex = -1;
  frame.title = name;
  frame.src = `film/index.html?scene=${encodeURIComponent(name)}`;
  node.append(frame);
  stage.insertBefore(node, video);
  const entry = { name, node, api: null, info: null, error: '', loading: true, posedAt: null, done: null };
  if (!old) films.set(name, entry);
  const current = () => filmTokens.get(name) === token;
  entry.done = (async () => {
    await within(new Promise(done => frame.addEventListener('load', done, { once: true })), 20000, `film/index.html?scene=${name} did not load.`);
    for (let tries = 0; tries < 200 && !frame.contentWindow?.__film; tries++) await sleep(25);
    const api = frame.contentWindow?.__film;
    if (!api) throw new Error(`film/scenes/${name}.mjs did not start. Open film/index.html?scene=${name} under this address and look at the console.`);
    entry.info = await within(api.ready, 20000, `The scene ${name} took more than 20 seconds to get ready.`);
    entry.api = api;
  })().catch(error => { entry.error = clean(error); }).then(async () => {
    entry.loading = false;
    // A newer attempt (or a drop) took over: this node is only kept while it is the one in the map.
    if (!current()) { if (films.get(name) !== entry) node.remove(); return; }
    if (old) {
      await frames();
      if (!current()) { node.remove(); return; }
      node.className = old.node.className;
      films.set(name, entry);
      old.node.remove();
    }
    const before = S.total;
    fitSilent();
    if (S.total !== before) {
      buildBar();
      if (S.want != null) { seek(S.want); S.want = null; }
    }
    R.stack = '';
  });
  return entry;
}

function filmNames() { return [...new Set(M.segments.filter(segment => segment.film).map(segment => segment.film))]; }

// A scene the edit does not play is as long as the scene says, which is known once its film has loaded.
function fitSilent() {
  for (const segment of M.segments) {
    const info = segment.silent && films.get(segment.film)?.info;
    if (info) segment.length = info.duration;
  }
  S.total = totalOf(M.segments);
}

// Nearest to the playhead first, so the film that is needed next is the first one made.
function byDistance() {
  const here = M.segments.indexOf(segmentAt(S.time));
  const far = name => Math.abs(M.segments.findIndex(segment => segment.film === name) - here);
  return (a, b) => far(a) - far(b);
}

let preloading = false;
async function preloadFilms() {
  if (preloading) return;
  preloading = true;
  try {
    for (;;) {
      // What is already loading (the film under the playhead) goes first.
      await Promise.all([...films.values()].map(entry => entry.done));
      const todo = filmNames().filter(name => !films.has(name)).sort(byDistance());
      if (!todo.length) break;
      await loadFilm(todo[0]).done;
      await idle();
    }
  } finally { preloading = false; }
}

// Films that changed on disk are made again beside the old ones and swapped in when ready,
// the nearest first, so the picture never goes blank and a save never makes a burst of work.
async function replaceFilms(names) {
  for (const name of [...names].sort(byDistance())) {
    if (!films.has(name)) continue;
    await loadFilm(name, true).done;
    await idle();
  }
}

// Frames are posed at the 30 fps the render uses, and only when the frame changes.
function pose(entry, local) {
  if (!entry.api || entry.error) return;
  const t = Math.min(Math.floor(local * FPS + 1e-6) / FPS, entry.info.duration);
  if (entry.posedAt === t) return;
  try { entry.api.seek(t); entry.posedAt = t; } catch (error) { entry.error = clean(error); }
}

function dropFilms(names) {
  for (const name of names) {
    const entry = films.get(name);
    if (!entry) continue;
    filmTokens.set(name, (filmTokens.get(name) || 0) + 1);
    entry.node.remove();
    films.delete(name);
  }
}


// ------------------------------------------------------------ the clock
// The recording's sound is the master clock while it is playing and in step with the cut, so
// picture and voice cannot drift. Everywhere else (a silent lead, a card holding after the voice,
// a scene the edit does not play, sound that stopped keeping up) the wall clock runs the cut, so
// the playhead always moves. A frame that throws is reported and the next one still runs.
const E = {
  last: performance.now(), beats: 0, errors: 0, recoveries: 0,
  waitSince: 0, placedAt: 0, ctValue: -1, ctChangedAt: 0, progress: 0, lastTime: -1, warned: false,
  cues: [], ringing: [],
};
const audioReady = () => !video.seeking && video.readyState >= 3 && !video.paused && !video.ended;
// The voice is off where the edit mutes a stretch of the recording (MUTE), and when the person mutes.
const hushAt = at => S.muted || (at != null && M.mute.some(([from, to]) => at >= from && at < to));

function blocked(error) {
  if (error?.name === 'AbortError') return;
  pauseNow();
  toast(error?.name === 'NotAllowedError' ? 'Sound was blocked. Press Space or click Play to start.' : `Sound could not start: ${error?.message || error}`, 'error', 5000);
}

function startAudio(at) {
  E.placedAt = performance.now();
  E.ctChangedAt = E.placedAt;
  if (Math.abs(video.currentTime - at) > 1 / 120) { try { video.currentTime = at; } catch { /* not ready yet */ } }
  video.playbackRate = S.rate;
  video.muted = hushAt(at);
  if (video.paused || video.ended) video.play()?.catch(blocked);
}

function advance(now) {
  const dt = clamp((now - E.last) / 1000, 0, .1);
  E.last = now;
  if (!S.playing || !M.segments.length) return;
  const before = S.time;
  const segment = segmentAt(before);
  const at = recAt(before);
  let next = before;

  const hush = hushAt(at);
  if (video.muted !== hush) video.muted = hush;

  if (at == null) {
    if (!video.paused) video.pause();
    E.waitSince = 0;
    next = before + dt * S.rate;
  } else {
    const drift = video.currentTime - at;
    if (video.currentTime !== E.ctValue) { E.ctValue = video.currentTime; E.ctChangedAt = now; }
    const frozen = !video.paused && now - E.ctChangedAt > 500;
    if (audioReady() && !frozen && Math.abs(drift) <= .25) {
      E.waitSince = 0;
      const heard = segment.start + segment.lead + (video.currentTime - segment.from);
      next = heard >= before - 1 / FPS ? Math.max(before, heard) : heard;
    } else {
      if (!E.waitSince) E.waitSince = now;
      if (now - E.waitSince > 1000) {
        next = before + dt * S.rate;
        if (!E.warned) { E.warned = true; toast('The sound is not keeping up, so the picture is playing on without it.', 'error', 5000); }
        if (now - E.placedAt > 1000) startAudio(at);
      } else if (!video.seeking && (Math.abs(drift) > .25 || frozen || video.paused || video.ended) && now - E.placedAt > 400) {
        startAudio(at);
      }
    }
  }

  if (S.loop && segment.length > 0 && next >= segment.start + segment.length - .5 / FPS) { seek(segment.start); return; }
  if (next >= S.total - .5 / FPS) { finish(); return; }
  fireCues(before, next);
  S.time = next;
}

// If the clock has not moved for a while with nothing waiting on it, start the sound again.
function watchdog(now) {
  if (!S.playing || document.hidden || S.time !== E.lastTime) { E.lastTime = S.time; E.progress = now; return; }
  if (now - E.progress < 2500) return;
  E.progress = now;
  E.recoveries++;
  E.waitSince = 0;
  const at = recAt(S.time);
  if (at != null) startAudio(at);
  toast('Playback stopped for a moment, so it was started again.', 'error', 3000);
}

function tick(now) {
  requestAnimationFrame(tick);
  E.beats++;
  for (const work of [advance, watchdog, render]) {
    try { work(now); } catch (error) {
      if (++E.errors <= 3) toast(`Something went wrong drawing a frame: ${error?.message || error}`, 'error', 6000);
      console.error(error);
    }
  }
}

// ------------------------------------------------------------ controls
function seek(t) {
  S.time = clamp(t, 0, Math.max(0, S.total - 1 / FPS));
  S.ended = false;
  stopSounds();
  E.placedAt = 0;
  if (S.playing) {
    const at = recAt(S.time);
    if (at != null && Math.abs(video.currentTime - at) > 1 / 120) { try { video.currentTime = at; } catch { /* not ready yet */ } }
    E.waitSince = performance.now();
    E.lastTime = -1;
  }
}

// While paused the recording is moved to the playhead once a frame, so a scrub stays cheap.
function placeVideo() {
  if (S.playing || !M.sound) return;
  const at = recAt(S.time);
  if (at != null && Math.abs(video.currentTime - at) > 1 / 60) { try { video.currentTime = at; } catch { /* not ready yet */ } }
}

function play(on = !S.playing) {
  if (!on) { if (S.playing) pauseNow(); return; }
  if (!S.total || S.playing) return;
  if (S.ended || S.time >= S.total - 2 / FPS) seek(0);
  S.playing = true;
  S.ended = false;
  const now = performance.now();
  Object.assign(E, { last: now, waitSince: now, progress: now, lastTime: -1, warned: false });
  const at = recAt(S.time);
  // Started here, inside the click or key press, so the browser lets the sound begin.
  if (at != null) startAudio(at);
}

function pauseNow() {
  S.playing = false;
  S.time = clamp(Math.round(S.time * FPS) / FPS, 0, Math.max(0, S.total - 1 / FPS));
  video.pause();
  stopSounds();
  E.waitSince = 0;
}

function finish() {
  S.time = Math.max(S.time, S.total - 1 / FPS, 0);
  S.playing = false;
  S.ended = true;
  video.pause();
  stopSounds();
}

function step(frames) {
  pauseNow();
  seek(Math.round(S.time * FPS) / FPS + frames / FPS);
}

function jumpPart(direction) {
  const index = M.segments.indexOf(segmentAt(S.time));
  if (index < 0) return;
  if (direction < 0) seek(S.time - M.segments[index].start > .3 ? M.segments[index].start : M.segments[Math.max(0, index - 1)].start);
  else if (index < M.segments.length - 1) seek(M.segments[index + 1].start);
}

function setRate(rate) { S.rate = rate; video.playbackRate = rate; prefs.set('rate', rate); }
function setMuted(on) { S.muted = on; video.muted = on; prefs.set('muted', on); }

// The cut time of a point in the recording, for when the page was hidden and only the sound moved.
function cutFromRecording(ct) {
  const segment = M.segments.find(s => !s.silent && ct >= s.from && ct < s.to);
  return segment ? segment.start + segment.lead + (ct - segment.from) : null;
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden || !S.playing) return;
  const heard = audioReady() ? cutFromRecording(video.currentTime) : null;
  if (heard != null) S.time = clamp(heard, 0, S.total);
  Object.assign(E, { last: performance.now(), progress: performance.now(), lastTime: -1 });
});

// ------------------------------------------------------------ part sounds
// A part can name sound effects (`sounds` in film/edit.mjs). compose lays them in at the part's start
// plus `at`; here they play as the clock crosses that time in normal playback, not after a jump.
function buildCues() {
  stopSounds();
  E.cues = M.segments
    .flatMap(segment => (segment.sounds || []).map(sound => ({ time: segment.start + (sound.at || 0), file: sound.file, gain: sound.gain || 0 })))
    .sort((a, b) => a.time - b.time);
  for (const cue of E.cues) {
    try { cue.audio = new Audio(`sounds/${encodeURIComponent(cue.file)}`); cue.audio.preload = 'auto'; cue.audio.volume = Math.min(1, 10 ** (cue.gain / 20)); } catch { cue.audio = null; }
  }
}
function fireCues(from, to) {
  if (to <= from || to - from > .3) return;
  for (const cue of E.cues) {
    if (cue.time <= from) continue;
    if (cue.time > to) break;
    if (S.muted || !cue.audio) continue;
    cue.audio.currentTime = 0;
    cue.audio.play()?.catch(() => {});
    E.ringing.push(cue.audio);
  }
}
function stopSounds() { for (const audio of E.ringing) audio.pause(); E.ringing = []; }


// ------------------------------------------------------------ drawing
// Every frame asks "what should the screen say?" and touches the page only where the answer changed.
const R = {
  stack: '', msg: '\0', vOpacity: -1, vTransform: null, cover: null, src: '',
  now: '', len: '', frame: '', where: '', word: -2, mode: '', ended: null, loop: null,
  seg: -1, aria: -1, head: -1, stageW: 320, barW: 0, fills: [], segs: [], fillEls: [], savedAt: -1, savedTime: -1,
};

const CAPTION = 36; // the height of the line of words under the picture
function layoutStage() {
  const box = $('stagebox');
  const width = Math.max(160, Math.floor(Math.min(box.clientWidth, (box.clientHeight - CAPTION) * 16 / 9)));
  stage.style.width = `${width}px`;
  stage.style.height = `${Math.round(width * 9 / 16)}px`;
  stage.style.setProperty('--scale', String(width / DESK));
  R.stageW = width;
  R.vTransform = null;
}
new ResizeObserver(layoutStage).observe($('stagebox'));
new ResizeObserver(() => { R.barW = $('bar').clientWidth; R.head = -1; fitTags(); }).observe($('bar'));

function stackFilms(current) {
  const key = `${current}|${[...films.values()].map(entry => entry.name + (entry.api ? 1 : 0)).join()}`;
  if (key === R.stack) return;
  R.stack = key;
  for (const entry of films.values()) {
    const ready = Boolean(entry.api) && !entry.error;
    entry.node.classList.toggle('show', ready && entry.name === current);
    entry.node.classList.toggle('under', ready && entry.name !== current);
  }
}

function setMessage(kind, title, body) {
  const key = `${kind}|${title}|${body}`;
  if (key === R.msg) return;
  R.msg = key;
  const node = $('message');
  node.hidden = !kind;
  node.className = `over message${kind === 'error' ? ' error' : ''}`;
  node.replaceChildren();
  if (!kind) return;
  if (kind === 'busy') node.insertAdjacentHTML('beforeend', icon('busy', 'big spin'));
  const head = document.createElement('div');
  head.className = 'title';
  head.textContent = title;
  node.append(head);
  if (body) {
    const text = document.createElement('div');
    text.className = 'body';
    text.textContent = body;
    node.append(text);
  }
}

function drawMessage(segment, entry) {
  if (M.loading) return setMessage('busy', 'Loading', '');
  if (M.error) return setMessage('error', 'The edit could not be read', M.error);
  if (!segment) return setMessage('info', 'The edit has no parts yet', 'Pick a scene from the list at the top to watch it on its own.');
  if (entry?.error) return setMessage('error', segment.film, entry.error);
  if (entry?.loading) return setMessage('busy', `Loading ${segment.film}`, '');
  setMessage('', '', '');
}

function drawVideo(segment, at) {
  let opacity = 0;
  let transform = 'none';
  let close = false;
  if (!segment.film) {
    opacity = 1;
    // A camera part punches in to the closer framing at each punchIn time.
    close = Boolean(at != null && M.close && (segment.punchIn || []).filter(cut => at >= cut).length % 2 === 1);
    if (close) {
      const width = video.videoWidth || 1920;
      const fit = R.stageW / width;
      const zoom = width / M.close.w;
      transform = `translate(${-M.close.x * fit * zoom}px, ${-M.close.y * fit * zoom}px) scale(${zoom})`;
    }
  }
  if (opacity !== R.vOpacity) { video.style.opacity = opacity; R.vOpacity = opacity; }
  if (transform !== R.vTransform) { video.style.transform = transform; R.vTransform = transform; }
  return close;
}

const labelOf = segment => segment.film || 'camera';

function drawCaption(at) {
  const index = at == null || !M.words.length ? -1 : wordAt(at);
  if (index === R.word) return;
  R.word = index;
  const spoken = (from, to) => M.words.slice(Math.max(0, from), to).map(word => word[0]).join(' ');
  $('capBefore').textContent = index < 0 ? '' : spoken(index - 10, index);
  $('capNow').textContent = index < 0 ? '' : M.words[index][0];
  $('capAfter').textContent = index < 0 ? '' : spoken(index + 1, index + 11);
}

function buildBar() {
  const track = $('track');
  track.replaceChildren();
  Object.assign(R, { segs: [], fillEls: [], fills: [], seg: -1, aria: -1, head: -1 });
  for (const segment of M.segments) {
    const node = document.createElement('div');
    node.className = `seg ${segment.film ? 'scene' : 'camera'}`;
    node.style.flex = `${Math.max(segment.length, .01)} 1 0px`;
    const body = document.createElement('div');
    body.className = 'body';
    const fill = document.createElement('div');
    fill.className = 'fill';
    const tag = document.createElement('div');
    tag.className = 'tag';
    const text = document.createElement('span');
    text.textContent = labelOf(segment);
    tag.append(text);
    tag.insertAdjacentHTML('beforeend', icon('repeat', 'again'));
    body.append(fill, tag);
    node.append(body);
    track.append(node);
    R.segs.push(node);
    R.fillEls.push(fill);
  }
  $('bar').setAttribute('aria-valuemax', S.total.toFixed(2));
  fitTags();
  drawPins();
}

// A name that does not fit its part is left out (half a name looks like a bug).
// The tip over the bar and the label by the clock still say which part it is.
function fitTags() {
  const tags = [...$('track').querySelectorAll('.tag')];
  tags.forEach(tag => tag.classList.remove('clipped'));
  tags.forEach(tag => tag.classList.toggle('clipped', tag.firstChild.offsetWidth > tag.clientWidth - 16));
}

function drawChrome(segment, at, close) {
  const now = stamp(S.time), len = stamp(S.total), frame = `f${Math.round(S.time * FPS)}`;
  if (now !== R.now) { $('now').textContent = now; R.now = now; }
  if (len !== R.len) { $('len').textContent = len; R.len = len; }
  if (frame !== R.frame) { $('frame').textContent = frame; R.frame = frame; }
  const where = !segment ? '' : segment.film ? `${segment.film} @ ${(S.time - segment.start).toFixed(2)}s`
    : at == null ? 'camera' : `camera @ recording ${at.toFixed(2)}s${close ? ' (close)' : ''}`;
  if (where !== R.where) { $('where').textContent = where; $('where').title = where; R.where = where; }

  const mode = S.playing ? 'pause' : S.ended ? 'replay' : 'play';
  if (mode !== R.mode) {
    R.mode = mode;
    setIcon($('playIcon'), mode);
    $('playIcon').classList.toggle('solid', mode !== 'replay');
    const label = { play: 'Play', pause: 'Pause', replay: 'Replay' }[mode];
    $('playBtn').setAttribute('aria-label', label);
    $('playBtn').title = `${label} (Space)`;
  }
  if (S.ended !== R.ended) {
    R.ended = S.ended;
    $('replay').hidden = !S.ended;
    $('continueBtn').hidden = !(only && M.sceneStart != null);
  }
  if (S.loop !== R.loop) {
    R.loop = S.loop;
    $('loopBtn').setAttribute('aria-pressed', String(S.loop));
    $('bar').classList.toggle('looping', S.loop);
  }

  const index = segment ? M.segments.indexOf(segment) : -1;
  if (index !== R.seg) { R.segs.forEach((node, i) => node.classList.toggle('here', i === index)); R.seg = index; }
  M.segments.forEach((part, i) => {
    const fraction = part.length > 0 ? clamp((S.time - part.start) / part.length, 0, 1) : 0;
    if (Math.abs(fraction - (R.fills[i] ?? -1)) > 1e-4) { R.fillEls[i].style.transform = `scaleX(${fraction})`; R.fills[i] = fraction; }
  });
  const x = S.total ? Math.round(S.time / S.total * R.barW * 2) / 2 : 0;
  if (x !== R.head) { $('head').style.transform = `translateX(${x}px)`; R.head = x; }
  const bucket = Math.floor(S.time * 4);
  if (bucket !== R.aria) {
    R.aria = bucket;
    const bar = $('bar');
    bar.setAttribute('aria-valuenow', S.time.toFixed(2));
    bar.setAttribute('aria-valuetext', `${stamp(S.time)}${segment ? ` in ${labelOf(segment)}` : ''}`);
  }
  drawComposer();
}

function render(now) {
  const segment = segmentAt(S.time);
  placeVideo();
  let entry = null;
  let at = null;
  let close = false;
  if (segment) {
    at = recAt(S.time);
    if (segment.film) { entry = loadFilm(segment.film); pose(entry, S.time - segment.start); }
    const showing = Boolean(segment.film && entry.api && !entry.error);
    stackFilms(showing ? segment.film : null);
    close = drawVideo(segment, at);
    if (showing !== R.cover) { R.cover = showing; $('cover').hidden = showing; }
  }
  drawMessage(segment, entry);
  drawCaption(at);
  drawChrome(segment, at, close);
  // The address keeps the playhead, so a reload (or a link) comes back to the same place.
  if (now - R.savedAt > 500 && S.time !== R.savedTime) {
    R.savedAt = now;
    R.savedTime = S.time;
    try { history.replaceState(null, '', `${location.pathname}${location.search}#t=${S.time.toFixed(2)}`); } catch { /* some frames forbid it */ }
  }
}


// ------------------------------------------------------------ input
// Everything the person can press, click or drag. A control only calls the engine (c-engine.js)
// and never keeps a copy of the state, so the buttons cannot disagree with the clock.

function flash(name) {
  const node = $('flash');
  setIcon($('flashIcon'), name);
  node.classList.remove('go');
  void node.offsetWidth;
  node.classList.add('go');
}

// Play or pause, and show the new state on the stage for a moment (as video sites do).
function toggle() {
  const was = S.playing;
  play(!was);
  if (S.playing !== was) flash(S.playing ? 'play' : 'pause');
}

function fullscreen() {
  if (!document.fullscreenEnabled) return;
  const asked = document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
  asked?.catch(() => toast('Full screen is not available in this window.', 'error'));
}
$('fsBtn').hidden = !document.fullscreenEnabled;
document.addEventListener('fullscreenchange', () => {
  const on = Boolean(document.fullscreenElement);
  const label = on ? 'Exit full screen' : 'Full screen';
  setIcon($('fsIcon'), on ? 'shrink' : 'expand');
  $('fsBtn').setAttribute('aria-label', label);
  $('fsBtn').title = `${label} (F)`;
});

function drawMute() {
  const label = S.muted ? 'Unmute' : 'Mute';
  setIcon($('muteIcon'), S.muted ? 'muted' : 'volume');
  $('muteBtn').setAttribute('aria-pressed', String(S.muted));
  $('muteBtn').setAttribute('aria-label', label);
  $('muteBtn').title = `${label} (M)`;
}
function mute() { setMuted(!S.muted); drawMute(); }

// ------------------------------------------------------------ menus
function menuItem(label, checked, onPick, hint = '') {
  const button = document.createElement('button');
  button.className = 'mi';
  button.setAttribute('role', 'menuitemradio');
  button.setAttribute('aria-checked', String(checked));
  const text = document.createElement('span');
  text.textContent = label;
  button.append(text);
  if (hint) {
    const note = document.createElement('span');
    note.className = 'hint';
    note.textContent = hint;
    button.append(note);
  }
  button.insertAdjacentHTML('beforeend', icon('check', 'tick'));
  button.addEventListener('click', onPick);
  return button;
}

const RATES = [.5, .75, 1, 1.25, 1.5, 2];
function drawRate() {
  $('rateLabel').textContent = `${S.rate}x`;
  for (const item of $('rateMenu').children) item.setAttribute('aria-checked', String(Number(item.dataset.rate) === S.rate));
}
// Picked with the keyboard, focus goes back to the button; picked with the mouse, it stays off it
// (a focused button would take the next Space press).
for (const rate of RATES) {
  const item = menuItem(`${rate}x`, rate === S.rate, event => { setRate(rate); drawRate(); closeMenu(rateEntry, event.detail === 0); });
  item.dataset.rate = String(rate);
  $('rateMenu').append(item);
}
const rateEntry = menu($('rateBtn'), $('rateMenu'), drawRate);
menu($('helpBtn'), $('helpMenu'));
drawRate();
drawMute();

const openMenu = () => menus.find(entry => !entry.panel.hidden);

// The arrow keys move through the items of an open list.
function menuKey(event, entry) {
  const items = [...entry.panel.querySelectorAll('.mi')];
  const at = items.indexOf(document.activeElement);
  const to = { ArrowDown: at + 1, ArrowUp: at < 0 ? items.length - 1 : at - 1, Home: 0, End: items.length - 1 }[event.key];
  if (!items.length || to === undefined) return false;
  items[(to + items.length) % items.length].focus();
  return true;
}

// ------------------------------------------------------------ buttons and the stage
$('playBtn').addEventListener('click', () => play());
$('prevBtn').addEventListener('click', () => jumpPart(-1));
$('nextBtn').addEventListener('click', () => jumpPart(1));
$('loopBtn').addEventListener('click', () => { S.loop = !S.loop; });
$('muteBtn').addEventListener('click', mute);
$('fsBtn').addEventListener('click', fullscreen);
$('replayBtn').addEventListener('click', () => { seek(0); play(true); });
$('continueBtn').addEventListener('click', () => { if (M.sceneStart != null) location.href = `./#t=${M.sceneStart.toFixed(2)}`; });
// A click that only closes a menu is not also a click on the picture.
let menuWasOpen = false;
addEventListener('pointerdown', () => { menuWasOpen = Boolean(openMenu()); }, true);
stage.addEventListener('click', event => {
  if (menuWasOpen) { menuWasOpen = false; return; }
  if (!event.target.closest('button')) toggle();
});
stage.addEventListener('dblclick', event => { if (!event.target.closest('button')) fullscreen(); });

// ------------------------------------------------------------ the timeline
const bar = $('bar');
let drag = null;
const barX = event => {
  const box = bar.getBoundingClientRect();
  return { x: clamp(event.clientX - box.left, 0, box.width), width: Math.max(1, box.width) };
};
const timeAt = event => { const { x, width } = barX(event); return x / width * S.total; };

function hover(event) {
  if (!S.total) return;
  const { x, width } = barX(event);
  const t = x / width * S.total;
  const tip = $('tip');
  $('ghost').hidden = false;
  $('ghost').style.left = `${x}px`;
  tip.hidden = false;
  tip.textContent = `${stamp(t)}\u00a0\u00a0${labelOf(segmentAt(t))}`;
  tip.style.left = `${clamp(x - tip.offsetWidth / 2, 0, Math.max(0, width - tip.offsetWidth))}px`;
}
function unhover() { $('ghost').hidden = true; $('tip').hidden = true; }

bar.addEventListener('pointerdown', event => {
  if (event.button !== 0 || !S.total) return;
  const pin = event.target.closest('.pin');
  if (pin) { pauseNow(); seek(Number(pin.dataset.time)); return; }
  try { bar.setPointerCapture(event.pointerId); } catch { /* the pointer is already gone */ }
  drag = { id: event.pointerId, resume: S.playing };
  if (S.playing) pauseNow();
  seek(timeAt(event));
  hover(event);
});
bar.addEventListener('pointermove', event => {
  hover(event);
  if (drag && event.pointerId === drag.id) seek(timeAt(event));
});
bar.addEventListener('pointerleave', () => { if (!drag) unhover(); });

// However a drag ends (let go, cancelled by the system, capture lost) the sound comes back.
function endDrag(event) {
  if (!drag || event.pointerId !== drag.id) return;
  const { resume } = drag;
  drag = null;
  try { bar.releasePointerCapture(event.pointerId); } catch { /* already released */ }
  if (event.pointerType !== 'mouse' || !bar.matches(':hover')) unhover();
  if (resume && S.time < S.total - 2 / FPS) play(true);
}
for (const type of ['pointerup', 'pointercancel', 'lostpointercapture']) bar.addEventListener(type, endDrag);

// ------------------------------------------------------------ keys
const typing = node => node instanceof Element && node.matches('input, textarea, select, [contenteditable=""], [contenteditable="true"]');

addEventListener('keydown', event => {
  if (event.defaultPrevented || event.isComposing || event.ctrlKey || event.metaKey || event.altKey) return;
  const key = event.key.length === 1 ? event.key.toLowerCase() : event.key;

  if (typing(event.target)) {
    if (key === 'Escape') { event.preventDefault(); escapeNote(); }
    return;
  }
  const entry = openMenu();
  if (key === 'Escape') {
    if (entry) { event.preventDefault(); closeMenu(entry, entry.panel.contains(document.activeElement)); }
    else if (drawerOpen) { event.preventDefault(); setDrawer(false); }
    return;
  }
  if (entry && menuKey(event, entry)) { event.preventDefault(); return; }
  // Space and Enter press the button that has focus; every other key is ours.
  if ((key === ' ' || key === 'Enter') && event.target.closest?.('button, a')) return;
  if (event.repeat && key !== 'ArrowLeft' && key !== 'ArrowRight') return;

  const act = {
    ' ': toggle, k: toggle,
    ArrowLeft: () => step(event.shiftKey ? -FPS : -1),
    ArrowRight: () => step(event.shiftKey ? FPS : 1),
    '[': () => jumpPart(-1),
    ']': () => jumpPart(1),
    Home: () => seek(0),
    End: () => { pauseNow(); seek(S.total); },
    l: () => { S.loop = !S.loop; },
    n: () => { pauseNow(); setDrawer(true, { focus: true }); },
    m: mute,
    f: fullscreen,
    // detail 1 reads as a mouse click, so focus does not move into the list or back to the button
    '?': () => $('helpBtn').dispatchEvent(new MouseEvent('click', { bubbles: true, detail: 1 })),
  }[key];
  if (!act) return;
  event.preventDefault();
  act();
});


// ------------------------------------------------------------ panels
// The scene list, the notes drawer, the export sheet and the small status pill at the top.

// A time in the whole cut: notes are stamped with it, so a note made while watching one scene
// still says where that moment is in the finished video.
const cutTime = () => (M.sceneStart != null ? M.sceneStart + S.time : S.time);

// ------------------------------------------------------------ the status pill
let pillTimer = 0;
function pill(text, { bad = false, ms = 0, title = '' } = {}) {
  const node = $('pill');
  clearTimeout(pillTimer);
  node.textContent = text;
  node.title = title;
  node.classList.toggle('bad', bad);
  node.hidden = false;
  if (ms) pillTimer = setTimeout(() => { node.hidden = true; }, ms);
}
function clearPill() { clearTimeout(pillTimer); $('pill').hidden = true; }
function updated() {
  const now = new Date();
  pill(`Updated ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`, { ms: 6000 });
}

// ------------------------------------------------------------ scenes
let sceneNames = null;
let sceneKey = '';

function drawScenes() {
  const inEdit = [...new Set(M.whole.map(part => part.film).filter(Boolean))];
  const others = (sceneNames || []).filter(name => !inEdit.includes(name));
  if (only && !inEdit.includes(only) && !others.includes(only)) others.unshift(only);
  const key = [only, inEdit, others].join('|');
  if (key === sceneKey) return;
  sceneKey = key;
  const open = name => { location.href = `./?scene=${encodeURIComponent(name)}`; };
  // Back to the whole edit at the moment being watched, when the edit plays this scene.
  const whole = () => { location.href = M.sceneStart != null ? `./#t=${cutTime().toFixed(2)}` : './'; };
  const items = [menuItem('Whole edit', !only, () => (only ? whole() : closeMenus()))];
  if (inEdit.length || others.length) items.push(document.createElement('hr'));
  for (const name of inEdit) items.push(menuItem(name, name === only, () => (name === only ? closeMenus() : open(name))));
  for (const name of others) items.push(menuItem(name, name === only, () => (name === only ? closeMenus() : open(name)), 'not in the edit'));
  $('sceneMenu').replaceChildren(...items);
}

async function loadScenes() {
  try {
    const response = await fetch('scenes', { cache: 'no-store' });
    const list = response.ok ? await response.json() : null;
    if (Array.isArray(list)) { sceneNames = list.map(String); drawScenes(); }
  } catch { /* the list stays as it was */ }
}
menu($('sceneBtn'), $('sceneMenu'), () => { drawScenes(); loadScenes(); });
$('sceneLabel').textContent = only ? `Scene: ${only}` : 'Whole edit';

// ------------------------------------------------------------ notes
// review/notes.md is the one place notes live; this list only reads it and appends to it.
let notes = null;
let notesKey = '';
let notesAt = 0;

async function loadNotes() {
  notesAt = Date.now();
  try {
    const response = await fetch('notes', { cache: 'no-store' });
    if (!response.ok) return;
    const text = await response.text();
    notes = [...text.matchAll(/^- \[( |x)\] (\S+) \((?:frame \d+)\) ([^:]+): (.*)$/gm)].map(([, done, at, where, body]) => {
      const [minutes, seconds] = at.split(':').map(Number);
      const time = minutes * 60 + seconds;
      return { done: done === 'x', time: Number.isFinite(time) ? time : null, at, where, body };
    });
  } catch { return; }
  drawNotes();
}

// Where a note sits on this page's own clock, or null when this page does not show that moment.
function noteAt(note) {
  if (note.time == null) return null;
  if (!only) return note.time;
  const part = M.sceneStart != null ? M.whole.find(candidate => candidate.film === only) : null;
  if (part && note.time >= part.start && note.time < part.start + part.length) return note.time - part.start;
  const own = /^(\S+) @ ([\d.]+)s$/.exec(note.where);
  return own && own[1] === only ? Number(own[2]) : null;
}

function goToNote(note) {
  const at = noteAt(note);
  if (at != null) { pauseNow(); seek(at); }
  else if (only && note.time != null) location.href = `./#t=${note.time.toFixed(2)}`;
  else toast('That moment is not in this video.', 'error', 2500);
}

function drawNotes() {
  if (!notes) return;
  const open = notes.filter(note => !note.done).length;
  $('notesCount').hidden = open === 0;
  $('notesCount').textContent = String(open);
  $('notesSummary').textContent = notes.length ? `${open} open${notes.length > open ? `, ${notes.length - open} done` : ''}` : '';
  const key = JSON.stringify(notes);
  if (key !== notesKey) {
    notesKey = key;
    const rows = notes.map(note => {
      const item = document.createElement('li');
      const row = document.createElement('button');
      row.className = `note${note.done ? ' done' : ''}`;
      for (const [name, text] of [['at', note.at], ['text', note.body], ['where2', note.where]]) {
        const cell = document.createElement('span');
        cell.className = name;
        cell.textContent = text;
        row.append(cell);
      }
      row.title = only && noteAt(note) == null ? 'Open this moment in the whole edit' : 'Go to this moment';
      row.addEventListener('click', () => goToNote(note));
      item.append(row);
      return item;
    });
    if (!rows.length) {
      const empty = document.createElement('li');
      empty.className = 'empty';
      empty.textContent = 'No notes yet. Press N at the frame you want to talk about.';
      rows.push(empty);
    }
    $('notes').replaceChildren(...rows);
  }
  drawPins();
}

// One dot on the timeline for each open note this page can show.
function drawPins() {
  const bar = $('bar');
  for (const pin of bar.querySelectorAll('.pin')) pin.remove();
  if (!notes || !S.total) return;
  for (const note of notes) {
    const at = note.done ? null : noteAt(note);
    if (at == null || at > S.total) continue;
    const pin = document.createElement('div');
    pin.className = 'pin';
    pin.style.left = `${at / S.total * 100}%`;
    pin.dataset.time = at.toFixed(3);
    pin.title = `${note.at}  ${note.body}`;
    bar.append(pin);
  }
}

// The notes file can be ticked off by someone else while the page is open.
function refreshNotes() { if (Date.now() - notesAt > 2000) loadNotes(); }
addEventListener('focus', refreshNotes);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshNotes(); });

// ------------------------------------------------------------ the drawer and the composer
let drawerOpen = false;
let composerKey = '';
// The drawer is docked (beside or under the picture) unless the window is too small, then it floats over it.
const docked = () => getComputedStyle($('drawer')).position !== 'absolute';

function setDrawer(open, { focus = false } = {}) {
  drawerOpen = open;
  $('drawer').hidden = !open;
  $('notesBtn').setAttribute('aria-pressed', String(open));
  if (open) {
    composerKey = '';
    drawComposer();
    loadNotes();
    if (focus) $('note').focus();
  } else {
    noteProblem('');
    if ($('drawer').contains(document.activeElement)) document.activeElement.blur();
  }
  // Remembered only where it is docked; a floating drawer would cover the picture on every load.
  if (docked()) prefs.set('drawer', open);
}
$('notesBtn').addEventListener('click', () => setDrawer(!drawerOpen));
$('drawerClose').addEventListener('click', () => setDrawer(false));

function drawComposer() {
  if (!drawerOpen) return;
  const at = stamp(cutTime());
  const key = `${at}|${R.where}`;
  if (key === composerKey) return;
  composerKey = key;
  $('noteAt').textContent = at;
  $('noteWhere').textContent = R.where;
}

function noteProblem(message) {
  $('noteProblem').textContent = message || '';
  $('noteProblem').hidden = !message;
}
$('note').addEventListener('input', () => noteProblem(''));

function escapeNote() {
  const input = $('note');
  input.value = '';
  noteProblem('');
  input.blur();
}

let saving = false;
$('composer').addEventListener('submit', async event => {
  event.preventDefault();
  const input = $('note');
  const text = input.value.replace(/\s+/g, ' ').trim();
  if (!text || saving) return;
  saving = true;
  const time = cutTime();
  const line = `${stamp(time)} (frame ${Math.round(time * FPS)}) ${R.where || 'edit'}: ${text}`;
  const before = notes ? notes.length : 0;
  try {
    const response = await fetch('notes', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ line }) });
    if (!response.ok) throw new Error(`The server answered ${response.status}.`);
    input.value = '';
    input.blur();
    noteProblem('');
    await loadNotes();
    const list = $('notes');
    list.scrollTop = list.scrollHeight;
    // The new row lights up where the eye already is, so no message has to cover the box.
    const fresh = notes && notes.length > before ? list.querySelector('li:last-child .note') : null;
    if (fresh) { fresh.classList.add('fresh'); setTimeout(() => fresh.classList.remove('fresh'), 1500); }
  } catch (error) {
    const why = error instanceof TypeError ? 'The preview server is not answering.' : String(error?.message || error);
    if (drawerOpen) noteProblem(`Not saved. ${why} Press Enter to try again.`);
    else toast(`The note was not saved. ${why} Your text is still in the box.`, 'error', 6000);
  } finally { saving = false; }
});

// ------------------------------------------------------------ export
// Quick draft and Export video run deliver.mjs on the server. The sheet shows how it is going,
// and keeps asking while it runs, so closing the sheet or reloading the page loses nothing.
const exp = { state: null, timer: 0, failures: 0, unseen: false, filesKey: '', statusKey: '' };
const job = { status: document.createElement('div'), log: document.createElement('pre') };
job.status.className = 'status';
$('job').append(job.status, job.log);

function drawExport() {
  const state = exp.state;
  const running = Boolean(state?.running);
  const failed = !running && state?.ok === false;
  const done = !running && state?.ok === true;
  const seconds = Math.round(Number(state?.seconds) || 0);

  $('draftBtn').disabled = $('finalBtn').disabled = running;
  setIcon($('exportIcon'), running ? 'busy' : 'down');
  $('exportIcon').classList.toggle('spin', running);
  $('exportLabel').textContent = running ? `${state.draft ? 'Drafting' : 'Exporting'} ${seconds}s` : 'Export';
  $('exportDot').hidden = !(exp.unseen && (failed || done));
  $('exportDot').className = `dot ${failed ? 'bad' : 'ok'}`;

  $('job').hidden = !(running || failed || done);
  const what = state?.draft ? 'quick draft' : 'video';
  const text = running ? `Making the ${what}, ${seconds}s`
    : failed ? `The ${what} failed after ${seconds}s`
    : done ? `The ${what} is ready (${seconds}s)` : '';
  const statusKey = `${running}|${failed}|${text}`;
  if (statusKey !== exp.statusKey) {
    exp.statusKey = statusKey;
    job.status.className = `status${failed ? ' bad' : ''}`;
    job.status.innerHTML = icon(running ? 'busy' : failed ? 'alert' : 'check', running ? 'spin' : '');
    const label = document.createElement('span');
    label.textContent = text;
    job.status.append(label);
  }
  const lines = (state?.log || []).slice(running ? -6 : -40);
  const log = lines.join('\n');
  if (job.log.textContent !== log) {
    job.log.textContent = log;
    job.log.scrollTop = job.log.scrollHeight;
  }
  job.log.hidden = !log;

  const files = [[state?.video, 0], [state?.draftVideo, 1]].filter(([file]) => file).sort(([a], [b]) => b.time - a.time);
  const filesKey = files.map(([file, draft]) => `${draft}|${file.file}|${file.size}|${ago(file.time)}`).join('\n');
  if (filesKey !== exp.filesKey) {
    exp.filesKey = filesKey;
    $('files').replaceChildren(...files.map(([file, draft]) => {
      const link = document.createElement('a');
      link.className = 'dl';
      link.href = `build/${encodeURIComponent(file.file)}`;
      link.download = file.file;
      link.title = `build/${file.file}`;
      link.insertAdjacentHTML('beforeend', icon('down'));
      const name = document.createElement('span');
      name.textContent = draft ? 'Download quick draft' : 'Download video';
      const small = document.createElement('small');
      small.textContent = `${size(file.size)}, ${ago(file.time)}`;
      link.append(name, small);
      return link;
    }));
  }
  $('files').hidden = !files.length;
}

function showExport(state) {
  const was = Boolean(exp.state?.running);
  exp.state = state;
  exp.failures = 0;
  if (was && !state.running) {
    const seen = !$('exportMenu').hidden;
    exp.unseen = !seen;
    const what = state.draft ? 'quick draft' : 'video';
    const hint = state.ok ? 'Open Export to download it.' : 'Open Export to read why.';
    toast(`The ${what} ${state.ok ? 'is ready' : 'failed'}.${seen ? '' : ` ${hint}`}`, state.ok ? 'ok' : 'error', 6000);
  }
  drawExport();
  clearTimeout(exp.timer);
  if (state.running) exp.timer = setTimeout(pollExport, 1000);
}

async function pollExport() {
  clearTimeout(exp.timer);
  try {
    const response = await fetch('export', { cache: 'no-store' });
    if (!response.ok) throw new Error(String(response.status));
    showExport(await response.json());
  } catch {
    // The server may be restarting: keep asking while a job was running, then give up quietly.
    if (exp.state?.running && ++exp.failures < 8) exp.timer = setTimeout(pollExport, 2000);
  }
}

async function startExport(draft) {
  try {
    const response = await fetch(`export?draft=${draft ? 1 : 0}`, { method: 'POST' });
    const state = await response.json().catch(() => null);
    if (!state) throw new Error(`The server answered ${response.status}.`);
    showExport(state);
    if (response.status === 409) toast('A video is already being made.', '', 2500);
  } catch (error) {
    toast(`Could not start the export. ${error?.message || error}`, 'error', 5000);
  }
}
$('draftBtn').addEventListener('click', () => startExport(true));
$('finalBtn').addEventListener('click', () => startExport(false));
menu($('exportBtn'), $('exportMenu'), () => { exp.unseen = false; exp.filesKey = ''; drawExport(); job.log.scrollTop = job.log.scrollHeight; pollExport(); });


// ------------------------------------------------------------ live refresh
// The server says which files under film/ were saved. The page reads the edit again and makes the
// changed films again beside the old ones, and never pauses, seeks or reloads: playback goes on.

const mediaUrl = bust => `media/${encodeURIComponent(M.recording)}${bust ? `?v=${Date.now()}` : ''}`;

function showName() {
  const name = M.name || 'Preview';
  $('name').textContent = name;
  document.title = only ? `${name}: ${only}` : `${name} preview`;
}

// What a film reads from the edit (film/timeline.mjs): its part's span, and the silent lead of the first part.
const filmInputs = (model, film) => {
  const part = model.whole.find(candidate => candidate.film === film);
  return part ? JSON.stringify([part.from, part.to, part.lead]) : '';
};

// Puts a new model in place and returns the films that must be made again.
function useModel(next) {
  const old = M;
  const before = filmNames();
  M = next;
  const after = filmNames();
  const removed = before.filter(name => !after.includes(name));
  const changed = after.filter(name => before.includes(name) && (old.take !== next.take || filmInputs(old, name) !== filmInputs(next, name)));
  if (old.recording !== next.recording || old.take !== next.take || old.sound !== next.sound) {
    if (next.sound) video.src = mediaUrl(old.recording === next.recording);
    else { video.removeAttribute('src'); video.load(); }
  }
  fitSilent();
  S.time = clamp(S.time, 0, Math.max(0, S.total - 1 / FPS));
  if (!S.total && S.playing) pauseNow();
  R.stack = '';
  R.word = -2;
  buildBar();
  buildCues();
  showName();
  dropFilms(removed);
  return changed;
}

const pending = { edit: false, all: false, scenes: false, films: new Set() };
let refreshTimer = 0;
let refreshing = false;
let again = false;

// files: names under film/ from the server, or null when anything may have changed.
function request(files) {
  if (!files) pending.all = pending.edit = true;
  else {
    for (const file of files) {
      const name = String(file).replace(/\\/g, '/');
      if (name === 'edit.mjs' || name === 'words.mjs') pending.edit = true;
      else if (/^scenes\/[a-z0-9-]+\.mjs$/.test(name)) { pending.films.add(name.slice(7, -4)); pending.scenes = true; }
      else pending.all = pending.edit = true;
    }
  }
  clearTimeout(refreshTimer);
  refreshTimer = setTimeout(refresh, 100);
}

// One refresh at a time; a save that arrives meanwhile is picked up when the current one ends.
async function refresh() {
  if (refreshing) { again = true; return; }
  refreshing = true;
  try {
    do {
      again = false;
      const work = { edit: pending.edit, all: pending.all, scenes: pending.scenes, films: [...pending.films] };
      pending.edit = pending.all = pending.scenes = false;
      pending.films.clear();
      await refreshOnce(work);
    } while (again);
  } catch (error) {
    console.error(error);
  } finally { refreshing = false; }
}

// Tells the person about a scene that failed to start, on the pill (a scene that is not being
// watched would otherwise fail without anyone knowing). Returns whether one failed.
function reportFilms() {
  const broken = [...films.values()].filter(entry => entry.error);
  if (!broken.length) return false;
  pill(broken.length === 1 ? `${broken[0].name} has an error` : `${broken.length} scenes have errors`, { bad: true, title: broken[0].error.split('\n')[0] });
  return true;
}

async function refreshOnce(work) {
  const changed = new Set(work.films);
  let problem = '';
  if (work.edit) {
    const result = await loadEdit();
    if (result.ok) useModel(buildModel(result.data)).forEach(name => changed.add(name));
    else problem = result.message;
  }
  if (work.all) filmNames().forEach(name => changed.add(name));
  if (work.scenes) loadScenes();
  await replaceFilms([...changed].filter(name => films.has(name)));
  preloadFilms();
  if (problem) {
    pill('The edit has an error', { bad: true, title: problem });
    toast(`film/edit.mjs has an error: ${problem}`, 'error', 8000);
  } else if (!reportFilms()) updated();
}

// ------------------------------------------------------------ the server connection
const link = { events: null, interrupted: false, lost: false, timer: 0 };

function connect() {
  link.events?.close();
  const events = new EventSource('events');
  link.events = events;
  events.onopen = () => {
    clearTimeout(link.timer);
    link.timer = 0;
    if (!link.interrupted) return;
    link.interrupted = false;
    if (link.lost) { link.lost = false; clearPill(); }
    request(null);
    pollExport();
  };
  events.onerror = () => {
    link.interrupted = true;
    if (!link.lost && !link.timer) link.timer = setTimeout(() => { link.timer = 0; link.lost = true; pill('Preview server is not answering', { bad: true }); }, 3000);
    // The browser retries by itself, unless the server answered with something that is not a stream.
    if (events.readyState === EventSource.CLOSED) setTimeout(connect, 2000);
  };
  events.onmessage = event => {
    let data = null;
    try { data = JSON.parse(event.data); } catch { /* an older server sends no details: anything may have changed */ }
    if (data?.page) {
      // The page itself was saved. The address keeps the playhead, so the reload comes back to it.
      try { sessionStorage.setItem('preview.reloaded', String(Date.now())); } catch { /* storage can be blocked */ }
      location.reload();
      return;
    }
    request(Array.isArray(data?.files) ? data.files : null);
  };
}

// ------------------------------------------------------------ start
const hashTime = () => {
  const match = /#t=([\d.]+)/.exec(location.hash);
  return match ? Number(match[1]) || 0 : null;
};
addEventListener('hashchange', () => { const t = hashTime(); if (t != null) seek(t); });

addEventListener('unhandledrejection', event => {
  if (event.reason?.name === 'AbortError') return;
  console.error(event.reason);
  toast(`Something went wrong: ${event.reason?.message || event.reason}`, 'error', 6000);
});

async function boot() {
  const wanted = hashTime() || 0;
  const result = await loadEdit();
  if (result.ok) useModel(buildModel(result.data));
  else { M = { ...M, loading: false, error: result.message }; showName(); }
  // A scene the edit does not play is as long as its film says, so its length comes later.
  if (S.total) seek(wanted); else if (wanted) S.want = wanted;
  loadNotes();
  pollExport();
  if (docked() && prefs.get('drawer', false) === true) setDrawer(true);
  await preloadFilms();
  let reloaded = false;
  try { reloaded = Date.now() - Number(sessionStorage.getItem('preview.reloaded')) < 15000; sessionStorage.removeItem('preview.reloaded'); } catch { /* storage can be blocked */ }
  if (!reportFilms() && reloaded) updated();
}

// For checks from a script: where the preview is and what it shows.
window.__preview = {
  seek: t => seek(Number(t)),
  play: on => play(on),
  state: () => ({
    time: S.time, total: S.total, playing: S.playing, ended: S.ended, loop: S.loop, rate: S.rate, muted: S.muted,
    part: R.where, message: $('message').hidden ? '' : $('message').textContent,
    videoTime: video.currentTime, loading: M.loading, error: M.error, expected: filmNames().length,
    films: [...films.values()].map(entry => ({ name: entry.name, ready: Boolean(entry.api), error: entry.error })),
    beats: E.beats, errors: E.errors, recoveries: E.recoveries,
  }),
};

requestAnimationFrame(tick);
connect();
boot().catch(error => { M = { ...M, loading: false, error: clean(error) }; });
</script>
</body>
</html>
