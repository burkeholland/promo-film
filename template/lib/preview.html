<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Preview</title>
<style>
:root {
  --bg: #0d1117; --panel: #151b23; --raised: #1c232d; --hover: #232b36; --line: #2a313c;
  --text: #e6edf3; --dim: #9198a1; --faint: #6e7681;
  --accent: #4493f8; --danger: #f85149; --ok: #3fb950;
  --sans: 'Segoe UI Variable Text', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --mono: 'Cascadia Mono', 'Cascadia Code', Consolas, ui-monospace, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; margin: 0; }
[hidden] { display: none !important; }
html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font: 13px/1.4 var(--sans); -webkit-font-smoothing: antialiased; }
body { min-width: 320px; }
button, input { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
button:disabled { cursor: default; opacity: .4; }
kbd { font: 11px var(--mono); padding: 1px 6px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; background: var(--raised); color: var(--text); }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.i.solid { fill: currentColor; stroke-width: 1; }
@keyframes spin { to { transform: rotate(360deg); } }
.spin { animation: spin .9s linear infinite; }

.app { display: grid; grid-template-rows: 44px minmax(0, 1fr) auto; height: 100vh; height: 100dvh; min-width: 320px; }

/* top bar */
.top { display: flex; align-items: center; gap: 8px; padding: 0 12px; border-bottom: 1px solid var(--line); min-width: 0; }
.name { font-size: 14px; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.grow { flex: 1; min-width: 0; }
.anchor { position: relative; display: flex; flex: none; }
.btn { display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 6px; color: var(--dim); flex: none; }
.btn:hover:not(:disabled), .btn[aria-expanded=true], .btn[aria-pressed=true] { background: var(--raised); color: var(--text); }
.btn.on { color: var(--accent); }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border-radius: 6px; color: var(--dim); white-space: nowrap; flex: none; }
.chip:hover:not(:disabled), .chip[aria-expanded=true], .chip[aria-pressed=true] { background: var(--raised); color: var(--text); }
.chip .i { color: var(--dim); }
.count { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--accent); color: #fff; font-size: 11px; font-weight: 600; line-height: 18px; text-align: center; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.dot.ok { background: var(--ok); }
.dot.bad { background: var(--danger); }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: 12px; background: var(--raised); color: var(--dim); font-size: 12px; white-space: nowrap; flex: none; }
.pill.bad { color: var(--danger); }
.pill .i { width: 13px; height: 13px; }

/* menus */
.menu { position: absolute; top: calc(100% + 6px); left: 0; z-index: 30; min-width: 190px; padding: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 12px 32px rgba(0, 0, 0, .5); }
.menu { max-height: min(70vh, 460px); overflow: auto; }
.menu.right { left: auto; right: 0; }
.menu.up { top: auto; bottom: calc(100% + 6px); }
.mi { display: flex; align-items: center; gap: 8px; width: 100%; padding: 6px 8px; border-radius: 6px; text-align: left; color: var(--text); white-space: nowrap; }
.mi:hover, .mi:focus-visible { background: var(--hover); }
.mi .i { color: var(--dim); }
.mi .tick { margin-left: auto; color: var(--accent); visibility: hidden; }
.mi[aria-checked=true] .tick { visibility: visible; }
.mi .hint { margin-left: auto; color: var(--faint); font-size: 12px; }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }
.sheet { width: 300px; padding: 12px; }
.sheet h3 { font-size: 12px; font-weight: 600; color: var(--dim); margin-bottom: 8px; }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; align-items: center; }
.keys dt { display: flex; gap: 4px; justify-content: flex-end; }
.keys dd { color: var(--dim); }

/* main */
.main { position: relative; display: flex; min-height: 0; min-width: 0; }
.room { flex: 1; min-width: 0; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); padding: 12px 12px 0; }
@media (min-width: 760px) { .room { padding: 16px 16px 0; } }
.stagebox { position: relative; min-height: 0; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.stage { position: relative; flex: none; background: #000; border-radius: 6px; overflow: hidden; box-shadow: 0 0 0 1px var(--line); --scale: 1; width: 320px; height: 180px; user-select: none; -webkit-user-select: none; }
.caption { flex: none; align-self: stretch; height: 36px; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 0 .35em; align-items: center; font-size: 14px; white-space: nowrap; overflow: hidden; }
.caption .before, .caption .after { overflow: hidden; display: flex; min-width: 0; }
.caption .before { justify-content: flex-end; color: var(--dim); -webkit-mask-image: linear-gradient(90deg, transparent, #000 40%); mask-image: linear-gradient(90deg, transparent, #000 40%); }
.caption .after { color: var(--faint); -webkit-mask-image: linear-gradient(90deg, #000 60%, transparent); mask-image: linear-gradient(90deg, #000 60%, transparent); }
.caption .now { color: var(--text); font-weight: 600; }
/* stage contents */
/* A film is a frame the size of the desktop (1536 x 864), scaled to fit, inside a box the size of the stage.
   will-change makes every box its own layer, drawn once at the size it is shown, so a cut only changes which
   layer is on top. Without it the first cut into a film with the desktop picture waited about 140 ms for it
   to be drawn. The hint is on the box and not on the scaled frame: the browser keeps a hinted layer's picture
   at a size it picks, and on the frame that was not the size shown, so the text came out soft. */
.film { position: absolute; inset: 0; overflow: hidden; will-change: transform; visibility: hidden; pointer-events: none; z-index: 0; }
.film iframe { position: absolute; left: 0; top: 0; width: 1536px; height: 864px; border: 0; background: #fff; transform-origin: 0 0; transform: scale(var(--scale)); }
.film.under { visibility: visible; z-index: 1; }
.film.show { visibility: visible; z-index: 2; }
#recording { position: absolute; left: 0; top: 0; width: 100%; height: auto; opacity: 0; transform-origin: 0 0; z-index: 4; pointer-events: none; }
.cover { position: absolute; inset: 0; background: #000; z-index: 3; }
.over { position: absolute; inset: 0; z-index: 6; display: grid; place-content: center; justify-items: center; gap: 10px; padding: 20px; text-align: center; }
.message { background: rgba(13, 17, 23, .8); }
.message.error { background: #0d1117; place-content: start center; overflow: auto; text-align: left; justify-items: stretch; }
.message .title { font-size: 14px; font-weight: 600; }
.message .body { color: var(--dim); max-width: 460px; white-space: pre-wrap; }
.message.error .title { color: var(--danger); }
.message.error .body { max-width: none; font: 12px/1.5 var(--mono); color: var(--text); }
.message .i.big { width: 22px; height: 22px; color: var(--dim); }
.flash { position: absolute; left: 50%; top: 50%; width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 50%; background: rgba(0, 0, 0, .6); display: grid; place-items: center; opacity: 0; pointer-events: none; z-index: 7; }
.flash .i { width: 26px; height: 26px; color: #fff; }
@keyframes flash { 0% { opacity: .95; transform: scale(.8); } 100% { opacity: 0; transform: scale(1.25); } }
.flash.go { animation: flash .5s ease-out; }
.ended { background: rgba(13, 17, 23, .62); z-index: 8; grid-auto-flow: row; }
.cta { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 36px; padding: 0 16px; border-radius: 8px; background: var(--accent); color: #fff; font-weight: 600; }
.cta:hover { background: #5aa0fa; }
.cta.quiet { background: var(--raised); color: var(--text); font-weight: 400; border: 1px solid var(--line); }
.cta.quiet:hover { background: var(--hover); }

/* dock */
.dock { border-top: 1px solid var(--line); background: var(--panel); min-width: 0; }
.transport { display: flex; align-items: center; gap: 4px; height: 52px; padding: 0 12px; }
.transport .side { display: flex; align-items: center; gap: 2px; margin-left: auto; min-width: 0; }
.play { width: 36px; height: 36px; border-radius: 50%; background: var(--accent); color: #fff; display: inline-grid; place-items: center; flex: none; margin: 0 4px; }
.play:hover:not(:disabled) { background: #5aa0fa; }
.play .i { width: 16px; height: 16px; }
.clock { font: 12px var(--mono); font-variant-numeric: tabular-nums; color: var(--dim); white-space: pre; margin: 0 8px; min-width: 17ch; }
.clock b { font-weight: 400; color: var(--text); }
.frame { font: 12px var(--mono); font-variant-numeric: tabular-nums; color: var(--faint); min-width: 7ch; }
.where { font: 12px var(--mono); color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-right: 8px; min-width: 0; }
.rate { font: 12px var(--mono); width: auto; min-width: 40px; padding: 0 6px; }

/* timeline */
.timeline { padding: 12px; height: 52px; }
.bar { position: relative; height: 28px; cursor: pointer; touch-action: none; user-select: none; -webkit-user-select: none; }
.track { position: absolute; inset: 0; display: flex; }
.seg { position: relative; min-width: 0; transition: opacity .15s; }
.seg .body { position: absolute; inset: 0 2px 0 0; border-radius: 4px; overflow: hidden; background: #1c2735; }
.seg:last-child .body { right: 0; }
.seg.camera .body { background: #2a2622; }
.seg .fill { position: absolute; inset: 0; background: rgba(68, 147, 248, .3); transform: scaleX(0); transform-origin: 0 0; }
.seg .tag { position: absolute; inset: 0; padding: 0 8px; line-height: 28px; font-size: 11px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; align-items: center; gap: 4px; }
.seg .tag.clipped span { visibility: hidden; }
.seg.here .tag { color: var(--text); }
.seg.here .body { box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .22); }
.seg .again { display: none; width: 12px; height: 12px; color: var(--accent); }
.looping .seg { opacity: .7; }
.looping .seg.here { opacity: 1; }
.looping .seg.here .body { box-shadow: inset 0 0 0 1.5px var(--accent); }
.looping .seg.here .again { display: block; }
.head { position: absolute; left: 0; top: -4px; bottom: -4px; width: 2px; margin-left: -1px; background: #fff; border-radius: 1px; box-shadow: 0 0 0 1px rgba(0, 0, 0, .35); pointer-events: none; z-index: 3; will-change: transform; }
.ghost { position: absolute; top: 0; bottom: 0; width: 1px; background: rgba(255, 255, 255, .35); pointer-events: none; z-index: 2; }
.tip { position: absolute; bottom: calc(100% + 10px); padding: 3px 8px; background: var(--raised); border: 1px solid var(--line); border-radius: 6px; font: 11px var(--mono); white-space: nowrap; pointer-events: none; z-index: 5; }
.pin { position: absolute; top: -3px; width: 6px; height: 6px; margin-left: -3px; border-radius: 50%; background: var(--accent); z-index: 4; }
.pin::before { content: ''; position: absolute; inset: -7px; }
.pin.done { background: var(--faint); }

/* notes drawer */
.drawer { display: flex; flex-direction: column; min-height: 0; width: min(340px, 100%); background: var(--panel); border-left: 1px solid var(--line); position: absolute; top: 0; right: 0; bottom: 0; z-index: 20; box-shadow: -12px 0 32px rgba(0, 0, 0, .35); }
@media (min-width: 800px) { .drawer { position: relative; width: 320px; flex: none; box-shadow: none; } }
/* A tall, narrow window has empty space under the picture, so the drawer sits there and the frame stays in view. */
@media (max-width: 799px) and (orientation: portrait) and (min-height: 560px) {
  .main { flex-direction: column; }
  .drawer { position: relative; width: auto; height: min(320px, 40vh); flex: none; border-left: 0; border-top: 1px solid var(--line); box-shadow: none; }
}
@media (max-width: 439px) { .drawer { width: 100%; } }
.drawer header { display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 16px; border-bottom: 1px solid var(--line); }
.drawer header h2 { font-size: 13px; font-weight: 600; }
.drawer header span { color: var(--faint); }
.notes { list-style: none; padding: 8px; overflow: auto; flex: 1; min-height: 0; }
.notes .empty { padding: 24px 12px; color: var(--faint); text-align: center; }
.note { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; width: 100%; padding: 8px; border-radius: 6px; text-align: left; align-items: baseline; }
.note:hover { background: var(--raised); }
.note .at { font: 12px var(--mono); color: var(--accent); }
.note .text { color: var(--text); overflow-wrap: anywhere; }
.note .where2 { grid-column: 2; font-size: 12px; color: var(--faint); }
.note.done .text { color: var(--faint); text-decoration: line-through; }
.note.done .at { color: var(--faint); }
.note.fresh { animation: fresh 1.4s ease-out; }
@keyframes fresh { from { background: rgba(68, 147, 248, .24); } }
.composer { padding: 12px; border-top: 1px solid var(--line); display: grid; gap: 6px; }
.composer .meta { display: flex; justify-content: space-between; gap: 8px; font: 12px var(--mono); color: var(--faint); }
.composer input { width: 100%; height: 34px; padding: 0 10px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; }
.composer .problem { font-size: 12px; color: var(--danger); overflow-wrap: anywhere; }
.composer input::placeholder { color: var(--faint); }
.composer input:focus { border-color: var(--accent); outline: none; }

/* export */
.job { display: grid; gap: 8px; margin-top: 12px; }
.job pre { max-height: 140px; overflow: auto; padding: 8px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; font: 11px/1.5 var(--mono); color: var(--dim); white-space: pre-wrap; }
.row { display: flex; gap: 8px; }
.row .cta { flex: 1; height: 32px; padding: 0 10px; font-weight: 400; }
.row .cta.go { font-weight: 600; }
.status { display: flex; align-items: center; gap: 8px; color: var(--dim); }
.status.bad { color: var(--danger); }
.dl { display: flex; align-items: center; gap: 8px; padding: 6px 8px; margin: 0 -8px; border-radius: 6px; color: var(--text); text-decoration: none; }
.dl:hover { background: var(--hover); }
.dl small { margin-left: auto; color: var(--faint); font-size: 12px; white-space: nowrap; }

/* toasts */
.toasts { position: fixed; left: 50%; bottom: 120px; transform: translateX(-50%); display: grid; gap: 8px; z-index: 60; pointer-events: none; width: max-content; max-width: calc(100vw - 24px); }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } }
.toast { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--raised); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 24px rgba(0, 0, 0, .45); animation: rise .18s ease-out; }
.toast.error { border-color: rgba(248, 81, 73, .55); }
.toast.error .i { color: var(--danger); }
.toast.ok .i { color: var(--ok); }

/* narrow */
@media (max-width: 639px) { .where { display: none; } }
@media (max-width: 759px) { .frame { display: none; } }
@media (max-width: 599px) { .chip .label, .prev, .next, .helpwrap { display: none; } .chip { padding: 0 8px; } .name { font-size: 13px; } }
@media (max-width: 439px) { .fswrap { display: none; } .transport, .top { padding: 0 8px; } .clock { margin: 0 4px; } }
@media (prefers-reduced-motion: reduce) { .flash.go, .toast { animation: none; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="i-play" viewBox="0 0 24 24"><polygon points="6 3 20 12 6 21 6 3"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><rect x="14" y="4" width="4" height="16" rx="1"/><rect x="6" y="4" width="4" height="16" rx="1"/></symbol>
  <symbol id="i-replay" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></symbol>
  <symbol id="i-prev" viewBox="0 0 24 24"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" x2="5" y1="19" y2="5"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" x2="19" y1="5" y2="19"/></symbol>
  <symbol id="i-repeat" viewBox="0 0 24 24"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></symbol>
  <symbol id="i-volume" viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></symbol>
  <symbol id="i-muted" viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="22" x2="16" y1="9" y2="15"/><line x1="16" x2="22" y1="9" y2="15"/></symbol>
  <symbol id="i-expand" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></symbol>
  <symbol id="i-shrink" viewBox="0 0 24 24"><path d="M8 3v3a2 2 0 0 1-2 2H3"/><path d="M21 8h-3a2 2 0 0 1-2-2V3"/><path d="M3 16h3a2 2 0 0 1 2 2v3"/><path d="M16 21v-3a2 2 0 0 1 2-2h3"/></symbol>
  <symbol id="i-note" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
  <symbol id="i-keys" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
  <symbol id="i-busy" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></symbol>

  <symbol id="i-film" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M7 3v18"/><path d="M3 7.5h4"/><path d="M3 12h18"/><path d="M3 16.5h4"/><path d="M17 3v18"/><path d="M17 7.5h4"/><path d="M17 16.5h4"/></symbol>
  <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/></symbol>
</svg>

<div class="app">
  <header class="top">
    <h1 class="name" id="name">Preview</h1>
    <div class="anchor">
      <button class="chip" id="sceneBtn" aria-haspopup="menu" aria-expanded="false" title="Watch one scene on its own"><svg class="i"><use href="#i-film"/></svg><span class="label" id="sceneLabel">Whole edit</span><svg class="i"><use href="#i-chev"/></svg></button>
      <div class="menu" id="sceneMenu" role="menu" hidden></div>
    </div>
    <span class="grow"></span>
    <span class="pill" id="pill" hidden></span>
    <button class="chip" id="notesBtn" aria-pressed="false" title="Notes (N)"><svg class="i"><use href="#i-note"/></svg><span class="label">Notes</span><span class="count" id="notesCount" hidden>0</span></button>
    <div class="anchor">
      <button class="chip" id="exportBtn" aria-haspopup="dialog" aria-expanded="false" title="Make a video file"><svg class="i" id="exportIcon"><use href="#i-down"/></svg><span class="label" id="exportLabel">Export</span><span class="dot" id="exportDot" hidden></span></button>
      <div class="menu right sheet" id="exportMenu" role="dialog" aria-label="Export" hidden>
        <div class="row"><button class="cta quiet" id="draftBtn">Quick draft</button><button class="cta go" id="finalBtn">Export video</button></div>
        <div class="job" id="job" hidden></div>
        <div id="files" style="margin-top:12px"></div>
      </div>
    </div>
  </header>

  <main class="main">
    <section class="room" id="room">
      <div class="stagebox" id="stagebox">
        <div class="stage" id="stage">
          <video id="recording" playsinline preload="auto"></video>
          <div class="cover" id="cover"></div>
          <div class="over message" id="message" hidden></div>
          <div class="flash" id="flash"><svg class="i solid" id="flashIcon"><use href="#i-play"/></svg></div>
          <div class="over ended" id="replay" hidden>
            <button class="cta" id="replayBtn"><svg class="i"><use href="#i-replay"/></svg>Replay</button>
            <button class="cta quiet" id="continueBtn" hidden>Continue in the whole edit</button>
          </div>
        </div>
        <div class="caption" id="caption" aria-hidden="true"><span class="before" id="capBefore"></span><span class="now" id="capNow"></span><span class="after" id="capAfter"></span></div>
      </div>
    </section>
    <aside class="drawer" id="drawer" aria-label="Notes" hidden>
      <header><h2>Notes</h2><span id="notesSummary"></span><span class="grow"></span><button class="btn" id="drawerClose" aria-label="Close notes" title="Close (Esc)"><svg class="i"><use href="#i-x"/></svg></button></header>
      <ul class="notes" id="notes"></ul>

        <div class="meta"><span id="noteAt">0:00.00</span><span id="noteWhere"></span></div>
        <input id="note" maxlength="400" autocomplete="off" placeholder="Note at this frame, then Enter" aria-label="Note at this frame">

    </aside>
  </main>

  <footer class="dock">
    <div class="transport">
      <button class="btn prev" id="prevBtn" aria-label="Previous part" title="Previous part ( [ )"><svg class="i solid"><use href="#i-prev"/></svg></button>
      <button class="play" id="playBtn" aria-label="Play" title="Play (Space)"><svg class="i solid" id="playIcon"><use href="#i-play"/></svg></button>
      <button class="btn next" id="nextBtn" aria-label="Next part" title="Next part ( ] )"><svg class="i solid"><use href="#i-next"/></svg></button>
      <span class="clock" id="clock"><b id="now">0:00.00</b> / <span id="len">0:00.00</span></span>
      <span class="frame" id="frame">f0</span>
      <div class="side">
        <span class="where" id="where"></span>
        <div class="anchor"><button class="btn rate" id="rateBtn" aria-haspopup="menu" aria-expanded="false" title="Speed"><span id="rateLabel">1x</span></button><div class="menu up right" id="rateMenu" role="menu" hidden></div></div>
        <button class="btn" id="loopBtn" aria-pressed="false" aria-label="Loop this part" title="Loop this part (L)"><svg class="i"><use href="#i-repeat"/></svg></button>
        <button class="btn" id="muteBtn" aria-pressed="false" aria-label="Mute" title="Mute (M)"><svg class="i" id="muteIcon"><use href="#i-volume"/></svg></button>
        <button class="btn fswrap" id="fsBtn" aria-label="Full screen" title="Full screen (F)"><svg class="i" id="fsIcon"><use href="#i-expand"/></svg></button>
        <div class="anchor helpwrap">
          <button class="btn" id="helpBtn" aria-haspopup="dialog" aria-expanded="false" aria-label="Keyboard shortcuts" title="Keyboard shortcuts (?)"><svg class="i"><use href="#i-keys"/></svg></button>
          <div class="menu up right sheet" id="helpMenu" role="dialog" aria-label="Keyboard shortcuts" hidden>
            <h3>Keyboard</h3>
            <dl class="keys">
              <dt><kbd>Space</kbd></dt><dd>Play or pause</dd>
              <dt><kbd>&larr;</kbd><kbd>&rarr;</kbd></dt><dd>One frame</dd>
              <dt><kbd>Shift</kbd><kbd>&larr;</kbd></dt><dd>One second</dd>
              <dt><kbd>[</kbd><kbd>]</kbd></dt><dd>Previous or next part</dd>
              <dt><kbd>Home</kbd><kbd>End</kbd></dt><dd>Start or end</dd>
              <dt><kbd>L</kbd></dt><dd>Loop this part</dd>
              <dt><kbd>N</kbd></dt><dd>Write a note here</dd>
              <dt><kbd>M</kbd></dt><dd>Mute</dd>
              <dt><kbd>F</kbd></dt><dd>Full screen</dd>

    <div class="timeline">
      <div class="bar" id="bar" role="slider" tabindex="0" aria-label="Timeline" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0">
        <div class="track" id="track"></div>
        <div class="ghost" id="ghost" hidden></div>
